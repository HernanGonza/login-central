# Plantilla nginx del portal (se renderiza con envsubst al arrancar el contenedor).
# Variables: ${API_UPSTREAM} (p. ej. http://portal-api:3000) y ${FORM_ACTION_ORIGINS}
# (orígenes de los sistemas a los que el portal envía el POST del pase, separados por espacio).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  client_max_body_size 64k;   # la API solo recibe JSON chico (ingreso)

  # Delante hay otro nginx (ecodatos): la IP real llega en X-Real-IP / X-Forwarded-For.
  # Solo se confía en esos encabezados si la conexión viene de una red de Docker.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Real-IP;

  # CSP del HTML. add_header no se hereda si el location define los suyos: por eso se repiten.
  #  - style-src 'unsafe-inline': necesario para el widget ALTCHA (estilos en su shadow DOM) y atributos style.
  #  - worker-src blob:: el widget ALTCHA resuelve la prueba de trabajo en un Worker creado desde un blob.
  #  - form-action: el POST autoenviado del pase va a los url_login de los sistemas.
  set $csp "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self' ${FORM_ACTION_ORIGINS}";

  # Proxy a la API. X-Forwarded-For se ENCADENA ($proxy_add_x_forwarded_for): el servidor usa TRUST_PROXY
  # (nº de saltos) para elegir la IP del cliente; no pisarlo permite contar los saltos reales.
  location /api/ {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_read_timeout 30s;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Claves públicas de firma (JWKS): las consumen los sistemas. La API ya fija su Cache-Control.
  location = /.well-known/jwks.json {
    proxy_pass ${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
  }

  # Archivos con hash en el nombre: cache larga e inmutable.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri =404;
  }

  # Fuentes y favicon (sin hash): cache moderada.
  location ~ ^/(fonts/|favicon\.svg$) {
    add_header Cache-Control "public, max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    try_files $uri =404;
  }

  # SPA: fallback a index.html, que nunca se cachea (referencia los assets con hash vigentes).
  location / {
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy $csp always;
    try_files $uri /index.html;
  }
}
