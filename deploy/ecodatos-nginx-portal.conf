# Bloque para pegar DENTRO del `server { ... }` de ecodatos (ecodatos/infra/nginx/nginx.conf),
# junto al location de /wiki/. Publica el portal en https://ecodatos.ecologia.misiones.gob.ar/portal/
#
# Cadena: navegador -> Caddy/haproxy (termina TLS) -> nginx de ecodatos (este bloque) -> portal-web -> portal-api.
# Requisitos: portal-web está en la red Docker "supabase" (lo hace docker-compose.yml) igual que el nginx de ecodatos.
# portal-web sirve en la RAÍZ de su contenedor: el rewrite quita /portal. El build del front usa base /portal/.
#
# (Para migrar al subdominio propio ver el server block comentado al final y deploy/DESPLIEGUE.md.)

location = /portal {
    return 301 /portal/;
}

location ^~ /portal/ {
    # DNS interno de Docker: nginx arranca aunque portal-web no exista todavía y resuelve en cada pedido.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portal http://portal-web:80;
    rewrite ^/portal/(.*)$ /$1 break;
    proxy_pass $portal;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Encadena: portal-api cuenta saltos con TRUST_PROXY (nginx de ecodatos + portal-web = 2; +1 por cada proxy extra delante).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # TLS lo termina Caddy/haproxy; el portal solo se publica por HTTPS
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    # Cuerpos chicos: el portal solo recibe JSON de ingreso. No heredar el client_max_body_size de 200M.
    client_max_body_size 64k;
    # No agregar cabeceras de seguridad aquí: las pone portal-web (CSP, HSTS, etc.).
}

